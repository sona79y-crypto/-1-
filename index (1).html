<style>
/* Layout: full-bleed top-down stage; thin HUD strip on top, touch controls bottom corners, centered overlay cards. Deliberate single monochrome look. */
:root{

  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--black);color:var(--bone);font-family:var(--body);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
#app{position:relative;height:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--dim);min-height:28px}
.hud .grp{display:flex;align-items:center;gap:6px}
.hud .lbl{font-size:11px;letter-spacing:.14em}
.keyslot{width:14px;height:14px;border:1.5px solid var(--dim);border-radius:50%}
.keyslot.on{background:var(--white);border-color:var(--white)}
.code{display:flex;gap:4px}
.code span{width:20px;height:24px;border-bottom:1.5px solid var(--dim);display:grid;place-items:center;color:var(--white);font-variant-numeric:tabular-nums;font-weight:600}
.stam{width:70px;height:5px;background:var(--smoke);border-radius:3px;overflow:hidden}
.stam i{display:block;height:100%;background:var(--bone);width:100%}
#stage{position:relative;flex:1;min-height:0;border:1px solid var(--smoke);border-radius:6px;overflow:hidden;background:var(--black);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;filter:grayscale(1)}
#near{position:absolute;left:0;right:0;top:8px;text-align:center;font-family:var(--serif);font-weight:800;font-size:13px;letter-spacing:.5em;color:var(--white);opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 0 10px #000;animation:nr 1s infinite}
@keyframes nr{50%{letter-spacing:.62em;color:#999}}
#stop{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(80px,26vw,220px)/1 Impact,"Arial Black",sans-serif;letter-spacing:.04em;color:#e00000;text-shadow:0 0 30px rgba(255,0,0,.6),6px 6px 0 #000;opacity:0;pointer-events:none;z-index:4}
#stop.on{opacity:1;animation:stopj .08s steps(2) infinite}
@keyframes stopj{50%{transform:translate(4px,-3px) scale(1.02)}}
#msg{position:absolute;left:0;right:0;top:14%;text-align:center;font-family:var(--serif);font-size:clamp(16px,4vw,22px);color:var(--white);opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 0 12px #000;padding-inline:16px}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,.7);border:1px solid var(--smoke);padding:6px 12px;border-radius:4px;color:var(--white);pointer-events:none;white-space:nowrap}
#prog{position:absolute;left:50%;bottom:calc(22% + 36px);transform:translateX(-50%);width:120px;height:4px;background:var(--smoke)}
#prog i{display:block;height:100%;background:var(--white);width:0}
.ctl{position:absolute;bottom:14px;display:flex;gap:10px;align-items:flex-end}
.ctl.r{right:14px}
.ctl button{font:600 13px var(--body);color:var(--white);background:rgba(20,20,20,.75);border:1px solid #444;border-radius:50%;width:64px;height:64px;cursor:pointer}
.ctl button.cd{opacity:.35}
.ctl button.on{background:var(--bone);color:var(--black)}
.ctl button:focus-visible,.card button:focus-visible{outline:2px solid var(--white);outline-offset:2px}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border:1px solid #555;border-radius:50%;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(220,220,220,.35)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.82);z-index:5;padding:16px;box-sizing:border-box;overflow:auto}
.ov.title{background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.55) 70%)}
.ov.title .card{background:rgba(5,5,5,.5);border:1px solid #222;padding:22px 20px;border-radius:4px;box-shadow:0 0 60px #000}
.codex{display:grid;gap:10px;text-align:left;max-height:52vh;overflow:auto}
.cx{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start;background:rgba(20,20,20,.8);border:1px solid #2a2a2a;padding:10px;border-radius:4px}
.cx canvas{width:92px;height:92px;display:block;border:1px solid #222}
.cxt{display:grid;gap:4px;min-width:0}
.cxt b{font-family:var(--serif);font-size:18px;color:var(--white)}
.cxt .kind{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.cxt dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;line-height:1.55}
.cxt dt{color:var(--dim)}.cxt dd{margin:0;color:var(--bone)}
.cx.locked{opacity:.55}
@media (max-width:420px){.cx{grid-template-columns:64px 1fr}.cx canvas{width:64px;height:64px}}
.pop{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(0,0,0,.7);padding:16px;box-sizing:border-box}
.popbox{position:relative;width:min(340px,100%);background:#0b0b0b;border:1px solid #333;border-radius:4px;padding:26px 20px 20px;display:grid;gap:12px;text-align:center;box-shadow:0 0 50px #000}
.popbox h3{font-family:var(--serif);font-size:24px;margin:0;color:var(--white)}
.popbox p{margin:0;color:var(--bone);font-size:14px;line-height:1.6}
.popq{font-size:16px!important;color:var(--white)!important}
.popbox .small,.card .small{font-size:12px;color:var(--dim)}
.popbox button{font:600 15px var(--body);border-radius:4px;padding:11px 18px;cursor:pointer;border:1px solid #555;background:transparent;color:var(--bone)}
.popbox button.primary{background:var(--white);color:var(--black);border-color:var(--white)}
.popx{position:absolute;top:8px;right:8px;padding:6px 10px!important;font-size:12px!important}
.col{display:grid;gap:8px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row>button{flex:1}
.howto{text-align:left;margin:0;padding-left:18px;color:var(--bone);font-size:14px;line-height:1.8}
.howto b{color:var(--white)}
.mini{font:600 15px var(--body);background:transparent;color:var(--bone);border:1px solid #444;border-radius:4px;padding:2px 9px;cursor:pointer;margin-right:8px}
.shopTop{display:flex;align-items:center;gap:8px}
.shopTop .q{width:40px;padding:10px 0}
.shopTop .coin{margin-left:auto;color:var(--dim);font-size:13px}.shopTop .coin b{color:var(--white);font-size:18px;font-variant-numeric:tabular-nums}
.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.job{display:grid;gap:5px;align-content:start;background:rgba(20,20,20,.85);border:1px solid #2a2a2a;border-radius:4px;padding:10px;text-align:center}
.job.eq{border-color:var(--white)}
.job canvas{width:100%;height:90px;display:block}
.job b{font-family:var(--serif);font-size:16px;color:var(--white)}
.job .look{font-size:11px;color:var(--dim)}
.job p{margin:0;font-size:12px;line-height:1.5}.job .eff{color:var(--bone);text-align:left}.job .price{color:var(--white);font-weight:600}
.job button{padding:9px 4px;font-size:12px;white-space:nowrap}
.ov>.card{margin:auto 0}
@media (max-width:460px){.jobs{grid-template-columns:1fr}.job{grid-template-columns:80px 1fr;text-align:left;align-items:center}.job canvas{grid-row:span 5;height:80px}}
.cxt .hint{font-size:12.5px;color:var(--bone);font-style:italic}
.log{display:grid;gap:8px;text-align:left;max-height:52vh;overflow:auto}
.lg{background:rgba(20,20,20,.8);border:1px solid #2a2a2a;border-radius:4px;padding:10px 12px}
.lg.new{border-color:var(--white)}
.lg b{font-family:var(--serif);color:var(--white);font-size:15px}
.lg p{margin:4px 0 0;font-size:12.5px;line-height:1.6;color:var(--bone)}
.idhud{color:var(--white);font-weight:600;margin-right:10px}
.mpform{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--dim)}
.mpform label{display:flex;flex-direction:column;gap:4px;text-align:left}
.card input,.card select,.popbox input{font:500 15px var(--body);background:#111;color:var(--white);border:1px solid #444;border-radius:4px;padding:9px 10px;min-width:0}
.rooms{display:grid;gap:6px;max-height:30vh;overflow:auto}
.room{display:flex;align-items:center;gap:10px;background:rgba(20,20,20,.85);border:1px solid #2a2a2a;border-radius:4px;padding:8px 10px;text-align:left}
.room>div{flex:1;display:grid;gap:2px;min-width:0}.room b{color:var(--white)}.room span{font-size:12px;color:var(--dim)}.room button{flex:0 0 auto;padding:8px 14px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px;text-align:left;font-size:14px;color:var(--bone)}
.plist .mini{font-size:11px;padding:2px 6px}
.chatbox{display:grid;gap:6px}
.chatlog{max-height:22vh;overflow:auto;text-align:left;font-size:13px;line-height:1.5;color:var(--bone);background:rgba(10,10,10,.85);border:1px solid #2a2a2a;border-radius:4px;padding:6px 8px;min-height:60px}
.chatlog b{color:var(--white)}.chatlog .sys{color:var(--dim);font-style:italic}
#chatwrap{position:absolute;left:12px;bottom:90px;width:min(340px,70%);z-index:6;display:grid;gap:6px}
#chatwrap input{font:500 14px var(--body);background:rgba(10,10,10,.9);color:var(--white);border:1px solid #555;border-radius:4px;padding:8px}
.devgrid{display:grid;gap:8px;text-align:left;max-height:60vh;overflow:auto}
.devgrid b{color:var(--white);font-size:13px}
.row.wrap>button{flex:0 0 auto;padding:7px 10px!important;font-size:12.5px!important}
#chatfeed{position:absolute;left:12px;top:40px;width:min(360px,72%);z-index:5;display:grid;gap:3px;font-size:13px;line-height:1.45;color:var(--bone);pointer-events:none}
#chatfeed>div{background:rgba(0,0,0,.6);padding:3px 8px;border-radius:3px;width:fit-content;max-width:100%}
#chatfeed b{color:var(--white)}#chatfeed .sys{color:var(--dim);font-style:italic}
.plist.ol li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.plist .dot{width:8px;height:8px;border-radius:50%;background:#e8e8e8;box-shadow:0 0 6px #fff}.plist .st{font-size:12px;color:var(--dim)}
.dmlog{max-height:34vh;min-height:120px}.dmlog .me{text-align:right}
.popbox input{width:100%;box-sizing:border-box}
.btnlink{display:block;font:600 15px var(--body);background:var(--white);color:var(--black);border-radius:4px;padding:13px 20px;text-decoration:none;text-align:center}
.kicker{font-size:11px;letter-spacing:.4em;color:var(--dim)}
.flick{text-shadow:0 0 18px rgba(255,255,255,.25),3px 0 0 rgba(255,255,255,.08),-3px 0 0 rgba(0,0,0,.9);animation:fl 5s infinite steps(1)}
@keyframes fl{0%,100%{opacity:1}31%{opacity:.25}32%{opacity:1}33%{opacity:.5}34%{opacity:1}77%{opacity:1;transform:translateX(0)}78%{opacity:.3;transform:translateX(3px)}79%{opacity:1;transform:translateX(0)}}

.card h1{font-family:var(--serif);font-weight:800;font-size:clamp(40px,11vw,60px);margin:0;color:var(--white);letter-spacing:.06em;line-height:1.1}
.card h2{font-family:var(--serif);font-weight:800;font-size:36px;margin:0;color:var(--white)}
.card p{margin:0;font-size:14px;line-height:1.7;color:var(--dim);text-wrap:pretty}
.card .keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;font-size:13px;color:var(--bone);margin-inline:auto}
.card .keys b{color:var(--white);font-weight:600}
.card button{font:600 15px var(--body);background:var(--white);color:var(--black);border:0;border-radius:4px;padding:13px 20px;cursor:pointer}
.card button.ghost{background:transparent;color:var(--bone);border:1px solid #555}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.pad button{background:var(--ash);color:var(--white);border:1px solid #444;padding:14px 0;font-size:20px;font-variant-numeric:tabular-nums}
.disp{font-size:34px;letter-spacing:.4em;color:var(--white);font-variant-numeric:tabular-nums;padding-left:.4em;min-height:44px}
[hidden]{display:none!important}
.hearts{color:var(--white);letter-spacing:2px;font-size:15px}
.hearts s{color:#444;text-decoration:none}
.diffs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .diffs button{background:var(--ash);color:var(--bone);border:1px solid #444;text-align:left;padding:10px 12px;display:grid;gap:3px}
.card .diffs button b{font-family:var(--serif);font-size:18px;color:var(--white)}
.card .diffs button span{font-size:11.5px;font-weight:400;color:var(--dim);line-height:1.4}
.card .diffs button.god{grid-column:1/-1}
.card .diffs button.locked{border-style:dashed;opacity:.8}
.card .diffs button .cond{font-size:11px;color:var(--dim);font-style:italic}
.card .diffs button.sel .cond{color:#333}
.card .diffs button.sel{background:var(--white);border-color:var(--white)}
.card .diffs button.sel b,.card .diffs button.sel span{color:var(--black)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

    p.on('connection',c=>{c.on('data',d=>{if(!d)return;hubSeen[c.peer]=Date.now();if(d.t==='hb')return;if(d.t==='me'){lob.conns[c.peer]=c;lob.users[c.peer]={id:String(d.id||'?').slice(0,12),st:String(d.st||'').slice(0,40),room:cleanRoom(d.room)};hubBroadcast()}

    c.on('close',()=>{if(lob.conn!==c)return;onlineUsers=[];lob={peer:null,hub:false,conns:{},users:{},conn:null,me:''};refreshPlayersBtn();try{p.destroy()}catch(e){}setTimeout(tryHub,300+Math.random()*2500)})});

  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*(.3-mood*.15+Math.sin(t*.8)*.04),W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(0,0,0,${Math.min(1,.86+mood*.2)})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  if(M.mode==='chase'&&state==='play'){const pl=.5+.5*Math.sin(t*5.5);ctx.fillStyle=`rgba(0,0,0,${.2+pl*.12})`;ctx.fillRect(0,0,W,H);const tv=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.1,W/2,H/2,Math.min(W,H)*.55);tv.addColorStop(0,'rgba(0,0,0,0)');tv.addColorStop(1,`rgba(0,0,0,${.88+pl*.1})`);ctx.fillStyle=tv;ctx.fillRect(0,0,W,H)}
  if(mood>.2){ctx.fillStyle=`rgba(255,255,255,${(Math.sin(t*9)*.5+.5)*mood*.05})`;ctx.fillRect(0,0,W,H)}
  // fingers creeping in from the edges as it gets close
  if(mood>.25&&state==='play'){const L=(mood-.25)*1.3;ctx.strokeStyle='#000';ctx.lineCap='round';for(let i=0;i<10;i++){const sd=i%2?1:-1,y0=H*(.12+hash(i*3.7)*.76),len=W*.22*L*(.6+hash(i*5.1)*.6)*(1+Math.sin(t*2+i)*.08),x0=sd<0?0:W;
    ctx.lineWidth=Math.max(3,S*.12)*(1-i*.03);ctx.beginPath();ctx.moveTo(x0,y0);const mx=x0-sd*len*.55,my=y0+Math.sin(t*1.7+i)*S*.3;ctx.quadraticCurveTo(mx,my-S*.2,x0-sd*len,my+S*.1);ctx.stroke();
    ctx.lineWidth=Math.max(1.5,S*.05);ctx.beginPath();ctx.moveTo(x0-sd*len,my+S*.1);ctx.lineTo(x0-sd*(len+S*.25),my+S*.25);ctx.stroke()}}
  if(state==='play'&&P.opened&&hash(Math.floor(t*15)+7)>.9992){ctx.globalCompositeOperation='difference';ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}

  // static when it has spotted you
  const st=Math.max(Math.min(1,gNoise*1.6),Math.min(1,M.flash),M.mode==='chase'&&state==='play'?.18:0,jump>0?1:0);
  if(st>0){for(let i=0;i<Math.floor(3+st*10);i++){const y=Math.random()*H,h=rnd(2,16)*st;ctx.drawImage(cv,0,y*dpr,W*dpr,Math.max(1,h*dpr),rnd(-30,30)*st,y,W,h)}
    ctx.fillStyle=`rgba(255,255,255,${.1*st})`;for(let i=0;i<1400*st;i++)ctx.fillRect(Math.random()*W,Math.random()*H,2,2);
    ctx.fillStyle=`rgba(0,0,0,${.18*st})`;for(let y=(t*90)%4;y<H;y+=4)ctx.fillRect(0,y,W,1.5)}

  // when it is close the whole picture warps, throbs and narrows
  if(state==='play'&&mood>.12&&jump<=0){const m=Math.min(1,mood*1.25);
    const pz=Math.max(0,pulseT);ctx.fillStyle=`rgba(0,0,0,${pz*.45*m})`;ctx.fillRect(0,0,W,H);
    const tv=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*(.42-m*.3-pz*.05),W/2,H/2,Math.min(W,H)*(.75-m*.25));tv.addColorStop(0,'rgba(0,0,0,0)');tv.addColorStop(1,`rgba(0,0,0,${.6+m*.4})`);ctx.fillStyle=tv;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=`rgba(255,255,255,${pz*.25*m})`;ctx.lineWidth=8;ctx.strokeRect(4,4,W-8,H-8)}
  // a faint, blurred face that is there and gone
  if(blurS>0&&jump<=0&&state==='play'){const jm=jumpMax,jj=jump,oc=ctx,oW=W,oH=H,w=Math.max(48,Math.round(W/7)),h=Math.max(36,Math.round(H/7));blurCv.width=w;blurCv.height=h;jumpMax=1;jump=.4+blurS;ctx=blurCv.getContext('2d');W=w;H=h;try{drawScare(t)}catch(e){}finally{ctx=oc;W=oW;H=oH;jumpMax=jm;jump=jj}
    ctx.save();ctx.globalAlpha=.34;ctx.imageSmoothingEnabled=true;ctx.drawImage(blurCv,rnd(-4,4),rnd(-4,4),W,H);ctx.restore()}
  // scare
  if(spiderEv)drawSpiderEvent(t);
  if(jump>0)({drawer:drawDrawerScare,closet:drawClosetScare,ceiling:drawCeilingScare,hands:drawHandsScare,spider:drawSpiderScare,void:drawVoidScare,peek:drawPeekScare,stalker:drawStalkerScare,slam:drawSlamScare}[scareType]||drawScare)(t);
  if(scene&&scene.t>1.05){const bh=H*.13*Math.min(1,(scene.t-1.05)/.3)*(scene.t>scene.dur-.5?Math.max(0,(scene.dur-scene.t)/.5):1);ctx.fillStyle='#000';ctx.fillRect(0,0,W,bh);ctx.fillRect(0,H-bh,W,bh)}
}

let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state==='play'&&!pauseOpen)update(dt);
  if(jump>0)jump-=dt;if(gNoise>0)gNoise-=dt;if(pulseT>0)pulseT-=dt*3.5;if(blurS>0)blurS-=dt;
  draw();requestAnimationFrame(loop)}

/* ── input ── */
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)&&document.activeElement.tagName!=='BUTTON')e.preventDefault();keys.add(e.code);
  if(state!=='play')return;
  if(e.code==='KeyP'&&DEV()&&!keypadOpen){if(pauseOpen&&devBox){devBox.close();devBox=null;pauseOpen=false}else if(!pauseOpen)devPanel();return}
  if((e.code==='Digit2'||e.code==='Numpad2')&&!keypadOpen){if(pauseOpen){if(document.querySelectorAll('.pop').length<=1)closePause()}else openPause();return}
  if(pauseOpen)return;
  if(keypadOpen){if(/^Digit\d$/.test(e.code))padKey(e.code.slice(5));if(e.code==='Backspace')padKey('지움');if(e.code==='Escape')padKey('닫기');return}
  if(e.code==='KeyZ')useCola();if(e.code==='KeyC')useBurger();if((e.code==='KeyT'||e.code==='Enter')&&mp){e.preventDefault();toggleChat(true);return}if(e.code==='KeyQ')dash();if(e.code==='KeyE'||e.code==='Space')interact();if(e.code==='KeyF')toggleLight()});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();runHeld=false});
function toggleLight(){if(P.hidden)return;if(!P.light&&P.bat<=0){say('배터리가 없다. 서랍에서 찾아보자',2);return}
  if(!P.light&&P.opened&&calm<=0&&Math.random()<.18){for(let i=0;i<6;i++){const gx=P.x+Math.cos(P.dir)*(1.3+i*.2),gy=P.y+Math.sin(P.dir)*(1.3+i*.2);if(!solidAt(gx,gy)){ghost={x:gx,y:gy,t:.4,max:.4};sting();gNoise=.5;addDrips(5);break}}}P.light=!P.light;$('bLight').classList.toggle('on',P.light);click()}
$('bLight').onclick=()=>state==='play'&&toggleLight();
$('bAct').onclick=interact;
$('bCola').onclick=useCola;$('bBurger').onclick=useBurger;$('bDev').onclick=()=>{if(pauseOpen&&devBox){devBox.close();devBox=null;pauseOpen=false}else devPanel()};$('bChat').onclick=()=>toggleChat();
$('chatin').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){sendChat(e.target.value);e.target.value=''}if(e.key==='Escape'){toggleChat(false);e.target.blur()}});
$('bDash').onclick=dash;
$('bMenu').onclick=()=>{if(state==='play'){if(pauseOpen)closePause();else openPause()}};
const run=$('bRun');run.addEventListener('pointerdown',e=>{runHeld=true;run.classList.add('on')});['pointerup','pointercancel','pointerleave'].forEach(t=>run.addEventListener(t,()=>{runHeld=false;run.classList.remove('on')}));
stage.addEventListener('pointerdown',e=>{if(spiderEv&&state==='play'){const r0=stage.getBoundingClientRect();spiderTap(e.clientX-r0.left,e.clientY-r0.top);return}if(e.target.closest('button')||state!=='play'||joyId!==null)return;const r=stage.getBoundingClientRect();joyId=e.pointerId;joyO={x:e.clientX,y:e.clientY};const j=$('joy');j.hidden=false;j.style.left=(e.clientX-r.left)+'px';j.style.top=(e.clientY-r.top)+'px';stage.setPointerCapture?.(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(e.pointerId!==joyId)return;let dx=e.clientX-joyO.x,dy=e.clientY-joyO.y;const l=Math.hypot(dx,dy),m=45;if(l>m){dx=dx/l*m;dy=dy/l*m}joyV={x:dx/m,y:dy/m};$('joy').firstChild.style.transform=`translate(${dx}px,${dy}px)`});
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,e=>{if(e.pointerId!==joyId)return;joyId=null;joyV={x:0,y:0};$('joy').hidden=true;$('joy').firstChild.style.transform=''}));

addEventListener('pointerdown',()=>{if(state==='menu'&&!ac){audio();startMenuMusic();const h=$('sndhint');if(h)h.textContent='소리를 켜고 하면 더 무섭다.'}},{capture:true});
addEventListener('keydown',()=>{if(state==='menu'&&!ac){audio();startMenuMusic()}},{capture:true});
fit();menu();requestAnimationFrame(loop);
})();
</script>
